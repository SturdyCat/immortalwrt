name: 构建 AX3000T 专属固件

# 只做手动触发：每次仅构建 xiaomi_mi-router-ax3000t（stock layout）一个机型，
# 不做全 target / 全设备构建，也不在 push 时自动跑。
on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: '复用 dl 下载缓存 + ccache 编译缓存（失败重跑几乎不用重编）'
        type: boolean
        default: true
      release_tag:
        description: '填写版本号则同时发布 GitHub Release（如 25.12-r1）；留空仅上传 Artifact'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-ax3000t
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SRC_DIR: bin/targets/mediatek/filogic
  # rules.mk 在 CONFIG_CCACHE=y 时把缓存目录设为 $(TOPDIR)/.ccache，
  # 这里只限制体积；runner 清理后约 14GB 可用，2G 足够一轮全量编译。
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放 runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          # apt 偶发返回 100（源站超时 / 索引损坏 / dpkg 锁竞争），runner 是临时环境，
          # 重试即可恢复；同清单在上一轮 run 已成功，优先按环境故障处理。
          sudo apt-get clean
          sudo rm -f /var/lib/apt/lists/lock \
                     /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend \
                     /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3; then
              ok=1
              break
            fi
            echo "apt-get update 第 $i 次失败，重试..."
          done
          [ "$ok" -eq 1 ] || {
            echo '错误：apt-get update 连续 3 次失败' >&2
            exit 1
          }

          DEPS="ack antlr3 asciidoc autoconf automake autopoint binutils bison \
                build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
                ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
                haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev \
                libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
                libreadline-dev libssl-dev libtool lzip lzma ninja-build 7zip p7zip-full \
                patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils \
                rsync scons squashfs-tools subversion swig texinfo unzip vim wget \
                xmlto xxd zlib1g-dev zstd file"
          LIST=""
          for p in $DEPS; do
            if apt-cache show "$p" 2>/dev/null | grep -q '^Package:'; then
              LIST="$LIST $p"
            else
              echo "跳过本系统不可用的依赖：$p"
            fi
          done
          # 空 LIST 会让 apt-get install 直接报 100；遇到就显式暴露，别伪装成环境问题。
          [ -n "$LIST" ] || {
            echo '错误：没有可安装的依赖，apt 索引可能为空' >&2
            exit 1
          }
          ok=0
          for i in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends $LIST; then
              ok=1
              break
            fi
            echo "apt-get install 第 $i 次失败，重试..."
          done
          [ "$ok" -eq 1 ] || {
            echo '错误：apt-get install 连续 3 次失败' >&2
            exit 1
          }
          ccache --version | head -1

      - name: 准备缓存目录
        run: mkdir -p dl .ccache

      # 缓存分两级：
      #   dl      —— 所有上游源码包，避免重复下载；
      #   .ccache —— 所有 C/C++ 编译结果（host 工具 / 交叉工具链 / 内核 / 软件包）。
      # ccache 按编译输入内容寻址，跨配置、跨 commit 复用都安全，
      # 比直接缓存 build_dir 更轻（不缓存数 GB 的中间产物与易失效的 stamp）。
      # key 末尾带 run_attempt：rerun 时用新 key 写回，restore-keys 仍能命中上一次。
      - name: 恢复下载缓存（dl）
        if: ${{ inputs.use_cache }}
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ax3000t-dl-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            ax3000t-dl-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-
            ax3000t-dl-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-
            ax3000t-dl-

      - name: 恢复 ccache 编译缓存
        if: ${{ inputs.use_cache }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ax3000t-ccache-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            ax3000t-ccache-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-
            ax3000t-ccache-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-
            ax3000t-ccache-

      - name: 更新 feeds（仅 packages / luci）
        run: ./scripts/feeds update -a

      - name: 构建时剪裁（架构 / subtarget / 主题 / 内核 / 补丁适配）
        run: |
          chmod +x scripts/ax3000t-prune.sh
          ./scripts/ax3000t-prune.sh

      - name: 安装 feeds
        run: ./scripts/feeds install -a

      - name: 载入 AX3000T 专属配置
        run: |
          cp ax3000t.config .config
          make defconfig
          # CCACHE 的 prompt 受 CONFIG_DEVEL 控制，本构建刻意关闭了 DEVEL，
          # 某些版本 make defconfig 会丢掉 seed 里的 CONFIG_CCACHE=y。
          # rules.mk 只读取这个变量本身，所以在 defconfig 之后兜底写回。
          if ! grep -q '^CONFIG_CCACHE=y' .config; then
            sed -i -e '/^# CONFIG_CCACHE is not set$/d' -e '/^CONFIG_CCACHE=/d' .config
            echo 'CONFIG_CCACHE=y' >> .config
            echo "已兜底写回 CONFIG_CCACHE=y"
          else
            echo "CONFIG_CCACHE=y 由 make defconfig 保留"
          fi
          echo "=== ccache 配置项 ==="
          grep 'CONFIG_CCACHE' .config || true
          # honk 是 eBPF CO-RE 程序，运行必须读到 /sys/kernel/btf/vmlinux。
          # BTF 依赖 DEBUG_INFO=y 且 !DEBUG_INFO_REDUCED；BUILDBOT=n 时 REDUCED
          # 默认为 y，defconfig 会连带把 seed 里的 BTF 静默丢弃。这里整条依赖链
          # 一起兜底写回，只写 BTF 而留着 REDUCED=y 仍然不会生效。
          if ! grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config; then
            sed -i -e '/^# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set$/d' -e '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
            sed -i -e '/^# CONFIG_KERNEL_DEBUG_INFO_BTF is not set$/d' -e '/^CONFIG_KERNEL_DEBUG_INFO_BTF=/d' .config
            sed -i -e '/^# CONFIG_KERNEL_DEBUG_INFO is not set$/d' -e '/^CONFIG_KERNEL_DEBUG_INFO=/d' .config
            cat >> .config <<'EOF'
          CONFIG_KERNEL_DEBUG_INFO=y
          # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          EOF
            echo "已兜底写回 BTF 依赖链（DEBUG_INFO=y / REDUCED=n / BTF=y）"
          else
            echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y 由 make defconfig 保留"
          fi
          echo "=== BTF 依赖链 ==="
          grep -E '^CONFIG_KERNEL_DEBUG_INFO(_BTF|_REDUCED)?' .config || true
          echo "=== 已启用的设备 ==="
          grep '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y' .config || true

      - name: 校验剪裁结果（单设备 / 内核符号 / zram 后端 / 禁用包 / ccache）
        run: |
          set -e
          grep -q '^CONFIG_CCACHE=y' .config || {
            echo "错误：ccache 未启用，二次构建会全量重编" >&2
            exit 1
          }

          count=$(grep -c '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y' .config || true)
          echo "启用设备数：$count"
          if [ "$count" -ne 1 ]; then
            echo "错误：应且仅应启用 xiaomi_mi-router-ax3000t 一个设备" >&2
            exit 1
          fi

          echo "=== 内核剪裁符号校验（保留 PCI core 供 mt76 编译） ==="
          for s in USB_SUPPORT MMC SCSI EXT4_FS F2FS_FS DEBUG_KERNEL DEBUG_FS; do
            if grep -q "^CONFIG_${s}=y" \
                 target/linux/mediatek/filogic/config-* target/linux/generic/config-* 2>/dev/null; then
              echo "错误：内核仍编译了 AX3000T 不存在的子系统 CONFIG_${s}" >&2
              exit 1
            fi
          done
          grep -q '^CONFIG_PCI=y' target/linux/mediatek/filogic/config-* 2>/dev/null || {
            echo "错误：CONFIG_PCI 未保留，mt76 的 mt7915/pci.c 会编译失败" >&2
            exit 1
          }

          echo "=== zram 后端校验（lz4 + zstd，默认 lz4，无 lzo / lz4hc） ==="
          for s in LZ4 ZSTD; do
            grep -q "^CONFIG_KERNEL_ZRAM_BACKEND_${s}=y" .config || {
              echo "错误：未启用 zram 后端 ${s}" >&2
              exit 1
            }
          done
          for s in LZO LZ4HC; do
            if grep -q "^CONFIG_KERNEL_ZRAM_BACKEND_${s}=y" .config; then
              echo "错误：多余的 zram 后端 ${s} 被启用" >&2
              exit 1
            fi
          done
          if grep -q '^CONFIG_KERNEL_ZRAM_BACKEND_FORCE_LZO=y' .config; then
            echo "错误：FORCE_LZO 生效，会把 lzo 后端重新选回来" >&2
            exit 1
          fi
          grep -q '^CONFIG_KERNEL_ZRAM_DEF_COMP_LZ4=y' .config || {
            echo "错误：zram 默认压缩器不是 lz4" >&2
            exit 1
          }
          if grep -qE '^CONFIG_KERNEL_ZRAM_DEF_COMP_(LZORLE|LZO|LZ4HC|ZSTD)=y' .config; then
            echo "错误：zram 默认压缩器存在冲突项" >&2
            exit 1
          fi
          grep -q '^CONFIG_PACKAGE_kmod-lib-lz4=y' .config || {
            echo "错误：lz4 压缩库 kmod-lib-lz4 未被依赖带入" >&2
            exit 1
          }

          echo "=== 禁用包校验 ==="
          for p in docker dockerd containerd runc docker-compose \
                   luci-app-docker luci-app-dockerman \
                   tailscale luci-app-tailscale-community \
                   zerotier luci-app-zerotier mwan3 luci-app-mwan3; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "错误：已禁用的包被启用：${p}" >&2
              exit 1
            fi
          done

          echo "=== DAWN 内置校验（后装会与滚动升级库 ABI 错配而 SIGSEGV） ==="
          for p in dawn umdns luci-app-dawn luci-i18n-dawn-zh-cn; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || {
              echo "错误：DAWN 相关包未被编入固件：${p}" >&2
              exit 1
            }
          done

          echo "=== DNS/DHCP 与 honk 内核依赖校验 ==="
          # 移除 OpenClash 时曾连基础 dnsmasq 一起删掉，导致固件无 DNS 无 DHCP
          for p in dnsmasq kmod-nfnetlink-queue kmod-nft-queue kmod-veth; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || {
              echo "错误：DNS/honk 必需项未被编入固件：${p}" >&2
              exit 1
            }
          done
          # honk 是 eBPF CO-RE 程序，缺 BTF 时 /sys/kernel/btf/vmlinux 不存在
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config || {
            echo "错误：内核未开启 DEBUG_INFO_BTF，honk 的 eBPF 无法运行" >&2
            exit 1
          }
          echo "全部校验通过"

      - name: 预下载源码包
        run: make download -j$(nproc) || make download -j1 V=s

      - name: 编译（单设备）
        run: |
          set -e
          # 只清零统计计数器，不清缓存内容，便于看本轮命中率
          ccache -z >/dev/null 2>&1 || true
          make -j$(nproc) || make -j1 V=s

      - name: ccache 命中统计
        if: ${{ always() && inputs.use_cache }}
        run: |
          echo "=== 本轮 ccache 统计 ==="
          ccache -s 2>/dev/null | head -30 || true
          echo "=== 缓存目录体积 ==="
          du -sh .ccache dl 2>/dev/null || true

      - name: 收集产物并打包为 7z
        id: collect
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -e
          if [ ! -d "$SRC_DIR" ]; then
            echo "错误：未找到 $SRC_DIR" >&2
            exit 1
          fi
          mkdir -p artifacts release
          # 仅取 AX3000T stock layout 产物，排除 ubootmod 变体
          find "$SRC_DIR" -maxdepth 1 -type f \
               -name '*ax3000t*' ! -name '*ubootmod*' \
               -exec cp {} artifacts/ \;
          # 可复现信息
          for f in config.buildinfo feeds.buildinfo version.buildinfo profiles.json; do
            cp "$SRC_DIR/$f" "artifacts/$f" 2>/dev/null || true
          done
          cp .config artifacts/ax3000t.config.expanded
          ./scripts/diffconfig.sh > artifacts/ax3000t.diffconfig 2>/dev/null || true
          (cd artifacts && find . -maxdepth 1 -type f ! -name sha256sums.txt \
                -printf '%f\n' | sort | xargs sha256sum > sha256sums.txt)
          echo "=== 产物清单 ==="
          ls -lh artifacts/

          # Release 与 Artifact 统一发布一个 7z 包：固件 + buildinfo + 校验清单。
          # 未手填版本号时用 snapshot-r<run_number> 自动发版，避免出现
          # 「构建成功但 Release 为空」；手填版本号则沿用自定义 tag。
          TAG="$INPUT_TAG"
          [ -n "$TAG" ] || TAG="snapshot-r${RUN_NO}"

          # 包名与 Release tag / run number 解耦，固定为
          #   immortalwrt-ax3000t-<固件版本号>-<构建日期 YYYYMMDD>.7z
          # 版本号取自编译产物 version.buildinfo 的 VERSION_NUMBER（SNAPSHOT
          # 或 25.12.2 之类），由 include/version.mk 生成；日期用 env 里的
          # TZ=Asia/Shanghai。tag 仍只用于 GitHub Release 的 tag/name。
          VER=$(grep -m1 '^VERSION_NUMBER=' "$SRC_DIR/version.buildinfo" 2>/dev/null \
                | sed -e "s/^VERSION_NUMBER=//" -e "s/^'//" -e "s/'$//" \
                      -e 's/^"//' -e 's/"$//')
          [ -n "$VER" ] || VER="SNAPSHOT"
          BUILD_DATE=$(date +%Y%m%d)
          SAFE_VER=$(printf '%s' "$VER" | tr -c 'A-Za-z0-9._-' '_')
          PKG="immortalwrt-ax3000t-${SAFE_VER}-${BUILD_DATE}.7z"
          echo "构建包名：$PKG（固件版本 $VER / 构建日期 $BUILD_DATE）"

          # ubuntu-24.04 的 7zip 包提供 7z / 7zz；p7zip-full 是旧版兼容项。
          SZ=""
          for c in 7z 7zz; do
            if command -v "$c" >/dev/null 2>&1; then SZ="$c"; break; fi
          done
          if [ -z "$SZ" ]; then
            sudo apt-get install -y --no-install-recommends 7zip \
              || sudo apt-get install -y --no-install-recommends p7zip-full
            SZ=$(command -v 7z || command -v 7zz)
          fi
          (cd artifacts && "$SZ" a -t7z -mx=5 -mmt=on -bso0 -bsp0 "../release/$PKG" ./*)
          (cd release && sha256sum "$PKG" > "${PKG}.sha256")
          echo "=== 7z 发布包 ==="
          ls -lh release/

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=${VER}-${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          {
            echo "### AX3000T 专属固件"
            echo ""
            echo "源码：\`${{ github.sha }}\` / 仅 mediatek-filogic / 仅 xiaomi_mi-router-ax3000t"
            echo ""
            echo '```'
            ls -lh artifacts/
            echo '```'
            echo ""
            echo "发布包：\`$PKG\`"
            echo '```'
            cat "release/${PKG}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ax3000t-${{ github.run_number }}
          path: |
            artifacts/
            release/
          retention-days: 30
          compression-level: 0

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.release_tag }}
          name: AX3000T ${{ steps.collect.outputs.release_title }}
          body: |
            ImmortalWrt AX3000T 单设备构建（mediatek/filogic，stock layout）。
            内置 OpenClash、rtp2httpd、Argon 主题及设备当前在用插件；不含其它机型与其它主题。

            下载 `immortalwrt-ax3000t-*.7z` 后用 7-Zip 解压，内含固件、
            buildinfo、展开配置与 sha256sums.txt；`*.7z.sha256` 用于校验压缩包。
          files: |
            release/*.7z
            release/*.7z.sha256
          fail_on_unmatched_files: true

      # 失败也保存：这次是在 package_compile 阶段挂的，dl 与 ccache 已经攒下，
      # 存下来后修好补丁重跑就几乎不用重新下载 / 重新编译。
      - name: 保存下载缓存（dl）
        if: ${{ always() && inputs.use_cache }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ax3000t-dl-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-${{ github.run_attempt }}

      - name: 保存 ccache 编译缓存
        if: ${{ always() && inputs.use_cache }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ax3000t-ccache-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-${{ github.run_attempt }}
