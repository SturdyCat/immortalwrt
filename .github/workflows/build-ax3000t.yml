name: 构建 AX3000T 专属固件

# 只做手动触发：每次仅构建 xiaomi_mi-router-ax3000t（stock layout）一个机型，
# 不做全 target / 全设备构建，也不在 push 时自动跑。
on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: '复用 dl 下载缓存 + ccache 编译缓存（失败重跑几乎不用重编）'
        type: boolean
        default: true
      release_tag:
        description: '填写版本号则同时发布 GitHub Release（如 25.12-r1）；留空仅上传 Artifact'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-ax3000t
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SRC_DIR: bin/targets/mediatek/filogic
  # rules.mk 在 CONFIG_CCACHE=y 时把缓存目录设为 $(TOPDIR)/.ccache，
  # 这里只限制体积；runner 清理后约 14GB 可用，2G 足够一轮全量编译。
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放 runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          DEPS="ack antlr3 asciidoc autoconf automake autopoint binutils bison \
                build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
                ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
                haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev \
                libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
                libreadline-dev libssl-dev libtool lzip lzma ninja-build p7zip-full \
                patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils \
                rsync scons squashfs-tools subversion swig texinfo unzip vim wget \
                xmlto xxd zlib1g-dev zstd file"
          LIST=""
          for p in $DEPS; do
            if apt-cache show "$p" 2>/dev/null | grep -q '^Package:'; then
              LIST="$LIST $p"
            else
              echo "跳过本系统不可用的依赖：$p"
            fi
          done
          sudo apt-get install -y --no-install-recommends $LIST
          ccache --version | head -1

      - name: 准备缓存目录
        run: mkdir -p dl .ccache

      # 缓存分两级：
      #   dl      —— 所有上游源码包，避免重复下载；
      #   .ccache —— 所有 C/C++ 编译结果（host 工具 / 交叉工具链 / 内核 / 软件包）。
      # ccache 按编译输入内容寻址，跨配置、跨 commit 复用都安全，
      # 比直接缓存 build_dir 更轻（不缓存数 GB 的中间产物与易失效的 stamp）。
      # key 末尾带 run_attempt：rerun 时用新 key 写回，restore-keys 仍能命中上一次。
      - name: 恢复下载缓存（dl）
        if: ${{ inputs.use_cache }}
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ax3000t-dl-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            ax3000t-dl-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-
            ax3000t-dl-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-
            ax3000t-dl-

      - name: 恢复 ccache 编译缓存
        if: ${{ inputs.use_cache }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ax3000t-ccache-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            ax3000t-ccache-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-
            ax3000t-ccache-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-
            ax3000t-ccache-

      - name: 更新 feeds（仅 packages / luci）
        run: ./scripts/feeds update -a

      - name: 构建时剪裁（架构 / subtarget / 主题 / 内核 / 补丁适配）
        run: |
          chmod +x scripts/ax3000t-prune.sh
          ./scripts/ax3000t-prune.sh

      - name: 安装 feeds
        run: ./scripts/feeds install -a

      - name: 载入 AX3000T 专属配置
        run: |
          cp ax3000t.config .config
          make defconfig
          # CCACHE 的 prompt 受 CONFIG_DEVEL 控制，本构建刻意关闭了 DEVEL，
          # 某些版本 make defconfig 会丢掉 seed 里的 CONFIG_CCACHE=y。
          # rules.mk 只读取这个变量本身，所以在 defconfig 之后兜底写回。
          if ! grep -q '^CONFIG_CCACHE=y' .config; then
            sed -i -e '/^# CONFIG_CCACHE is not set$/d' -e '/^CONFIG_CCACHE=/d' .config
            echo 'CONFIG_CCACHE=y' >> .config
            echo "已兜底写回 CONFIG_CCACHE=y"
          else
            echo "CONFIG_CCACHE=y 由 make defconfig 保留"
          fi
          echo "=== ccache 配置项 ==="
          grep 'CONFIG_CCACHE' .config || true
          echo "=== 已启用的设备 ==="
          grep '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y' .config || true

      - name: 校验剪裁结果（单设备 / 内核符号 / zram 后端 / 禁用包 / ccache）
        run: |
          set -e
          grep -q '^CONFIG_CCACHE=y' .config || {
            echo "错误：ccache 未启用，二次构建会全量重编" >&2
            exit 1
          }

          count=$(grep -c '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y' .config || true)
          echo "启用设备数：$count"
          if [ "$count" -ne 1 ]; then
            echo "错误：应且仅应启用 xiaomi_mi-router-ax3000t 一个设备" >&2
            exit 1
          fi

          echo "=== 内核剪裁符号校验（保留 PCI core 供 mt76 编译） ==="
          for s in USB_SUPPORT MMC SCSI EXT4_FS F2FS_FS DEBUG_KERNEL DEBUG_FS; do
            if grep -q "^CONFIG_${s}=y" \
                 target/linux/mediatek/filogic/config-* target/linux/generic/config-* 2>/dev/null; then
              echo "错误：内核仍编译了 AX3000T 不存在的子系统 CONFIG_${s}" >&2
              exit 1
            fi
          done
          grep -q '^CONFIG_PCI=y' target/linux/mediatek/filogic/config-* 2>/dev/null || {
            echo "错误：CONFIG_PCI 未保留，mt76 的 mt7915/pci.c 会编译失败" >&2
            exit 1
          }

          echo "=== zram 后端校验（lz4 + zstd，默认 lz4，无 lzo / lz4hc） ==="
          for s in LZ4 ZSTD; do
            grep -q "^CONFIG_KERNEL_ZRAM_BACKEND_${s}=y" .config || {
              echo "错误：未启用 zram 后端 ${s}" >&2
              exit 1
            }
          done
          for s in LZO LZ4HC; do
            if grep -q "^CONFIG_KERNEL_ZRAM_BACKEND_${s}=y" .config; then
              echo "错误：多余的 zram 后端 ${s} 被启用" >&2
              exit 1
            fi
          done
          if grep -q '^CONFIG_KERNEL_ZRAM_BACKEND_FORCE_LZO=y' .config; then
            echo "错误：FORCE_LZO 生效，会把 lzo 后端重新选回来" >&2
            exit 1
          fi
          grep -q '^CONFIG_KERNEL_ZRAM_DEF_COMP_LZ4=y' .config || {
            echo "错误：zram 默认压缩器不是 lz4" >&2
            exit 1
          }
          if grep -qE '^CONFIG_KERNEL_ZRAM_DEF_COMP_(LZORLE|LZO|LZ4HC|ZSTD)=y' .config; then
            echo "错误：zram 默认压缩器存在冲突项" >&2
            exit 1
          fi
          grep -q '^CONFIG_PACKAGE_kmod-lib-lz4=y' .config || {
            echo "错误：lz4 压缩库 kmod-lib-lz4 未被依赖带入" >&2
            exit 1
          }

          echo "=== 禁用包校验 ==="
          for p in docker dockerd containerd runc docker-compose \
                   luci-app-docker luci-app-dockerman \
                   tailscale luci-app-tailscale-community \
                   zerotier luci-app-zerotier mwan3 luci-app-mwan3; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "错误：已禁用的包被启用：${p}" >&2
              exit 1
            fi
          done
          echo "全部校验通过"

      - name: 预下载源码包
        run: make download -j$(nproc) || make download -j1 V=s

      - name: 编译（单设备）
        run: |
          set -e
          # 只清零统计计数器，不清缓存内容，便于看本轮命中率
          ccache -z >/dev/null 2>&1 || true
          make -j$(nproc) || make -j1 V=s

      - name: ccache 命中统计
        if: ${{ always() && inputs.use_cache }}
        run: |
          echo "=== 本轮 ccache 统计 ==="
          ccache -s 2>/dev/null | head -30 || true
          echo "=== 缓存目录体积 ==="
          du -sh .ccache dl 2>/dev/null || true

      - name: 收集产物
        run: |
          set -e
          if [ ! -d "$SRC_DIR" ]; then
            echo "错误：未找到 $SRC_DIR" >&2
            exit 1
          fi
          mkdir -p artifacts
          # 仅取 AX3000T stock layout 产物，排除 ubootmod 变体
          find "$SRC_DIR" -maxdepth 1 -type f \
               -name '*ax3000t*' ! -name '*ubootmod*' \
               -exec cp {} artifacts/ \;
          # 可复现信息
          for f in config.buildinfo feeds.buildinfo version.buildinfo profiles.json; do
            cp "$SRC_DIR/$f" "artifacts/$f" 2>/dev/null || true
          done
          cp .config artifacts/ax3000t.config.expanded
          ./scripts/diffconfig.sh > artifacts/ax3000t.diffconfig 2>/dev/null || true
          (cd artifacts && find . -maxdepth 1 -type f ! -name sha256sums.txt \
                -printf '%f\n' | sort | xargs sha256sum > sha256sums.txt)
          echo "=== 产物清单 ==="
          ls -lh artifacts/
          {
            echo "### AX3000T 专属固件"
            echo ""
            echo "源码：\`${{ github.sha }}\` / 仅 mediatek-filogic / 仅 xiaomi_mi-router-ax3000t"
            echo ""
            echo '```'
            ls -lh artifacts/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ax3000t-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          compression-level: 0

      - name: 发布 Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: AX3000T ${{ inputs.release_tag }}
          body: |
            ImmortalWrt AX3000T 单设备构建（mediatek/filogic，stock layout）。
            内置 OpenClash、rtp2httpd、Argon 主题及设备当前在用插件；不含其它机型与其它主题。
          files: artifacts/*

      # 失败也保存：这次是在 package_compile 阶段挂的，dl 与 ccache 已经攒下，
      # 存下来后修好补丁重跑就几乎不用重新下载 / 重新编译。
      - name: 保存下载缓存（dl）
        if: ${{ always() && inputs.use_cache }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ax3000t-dl-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-${{ github.run_attempt }}

      - name: 保存 ccache 编译缓存
        if: ${{ always() && inputs.use_cache }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ax3000t-ccache-${{ hashFiles('ax3000t.config', 'feeds.conf.default', 'scripts/ax3000t-prune.sh') }}-${{ github.run_number }}-${{ github.run_attempt }}
